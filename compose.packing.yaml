name: tripdock-packing
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: tripdock_packing
      POSTGRES_USER: tripdock
      POSTGRES_PASSWORD: tripdock
    ports:
      - "127.0.0.1:55434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripdock -d tripdock_packing"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - packing_data:/var/lib/postgresql/data
  test-postgres:
    image: postgres:17.6-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: tripdock_test
      POSTGRES_USER: tripdock
      POSTGRES_PASSWORD: tripdock
    ports:
      - "127.0.0.1:55435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripdock -d tripdock_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
volumes:
  packing_data:
