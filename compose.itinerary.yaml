name: tripdock-itinerary

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: tripdock_itinerary
      POSTGRES_USER: tripdock
      POSTGRES_PASSWORD: tripdock
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripdock -d tripdock_itinerary"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - itinerary_data:/var/lib/postgresql/data

volumes:
  itinerary_data:
