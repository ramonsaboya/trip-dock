name: tripdock-production

x-api: &api
  image: tripdock-api:${TRIPDOCK_RELEASE:?Set a release identifier}
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: api
  environment:
    NODE_ENV: production
    API_HOST: 0.0.0.0
    API_PORT: "4000"
    DATABASE_URL: postgresql://tripdock:${POSTGRES_PASSWORD:?Set a URL-safe database password}@postgres:5432/tripdock
    WEB_ORIGIN: ${PUBLIC_ORIGIN:?Set the HTTPS origin}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENAI_MODEL: ${OPENAI_MODEL:-}
  init: true
  security_opt:
    - no-new-privileges:true
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tripdock
      POSTGRES_USER: tripdock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a URL-safe database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripdock -d tripdock"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  migrate:
    <<: *api
    restart: "no"
    command: ["node", "apps/api/dist/scripts/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api
    restart: unless-stopped
    ports:
      - "127.0.0.1:4040:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/graphql',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query:'{ trips { id } }'})}).then(async r=>{const b=await r.json();if(!r.ok||b.errors||!b.data)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    image: tripdock-web:${TRIPDOCK_RELEASE:?Set a release identifier}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
      args:
        PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set the HTTPS origin}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3040:3000"
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *logging

volumes:
  postgres_data:
