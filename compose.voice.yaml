name: tripdock-voice

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: tripdock_voice
      POSTGRES_USER: tripdock
      POSTGRES_PASSWORD: tripdock
    ports:
      - "127.0.0.1:55436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripdock -d tripdock_voice"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - voice_data:/var/lib/postgresql/data

volumes:
  voice_data:
